<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Entrenamiento Clínico-IA: simulador de casos clínicos para médicos, enfermería y salud mental. Gamificado, con casos de la semana basados en estudios reales. SkyNet Genesis.">
<meta name="theme-color" content="#1E3A4C"><meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231E3A4C%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%23E0A21A%27/%3E%3C/svg%3E">
<script src="config.js?v=182477"></script>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icono-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Entrenamiento Clínico-IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Diseño: app de una columna con barra superior blanca; el turno simulado usa un monitor de signos vitales oscuro fijo arriba.
   Paleta obligatoria SkyNet Genesis (solo modo claro). Medallas por categoría con colores propios (semánticos). */
:root{
  --azul:#0B4F8A; --azul2:#1867B0; --verde:#14A38B; --verdeOsc:#0E8571; --wa:#1F8A4C;
  --bg:#F4F8FB; --sup:#FFFFFF; --txt:#1C2B39; --suave:#5D6B78; --borde:#DCE5EE;
  --azulSuave:#E8F1FA; --verdeSuave:#E3F6F2;
  --rojo:#C0392B; --rojoSuave:#FDECEA; --ambar:#B7791F; --ambarSuave:#FFF6E0;
  --monitor:#13202B; --monLinea:#2A3D4C; --monTxt:#9FB3C4; --monVerde:#3DDC97; --monAmbar:#F6C344; --monAzul:#6EC1FF; --monCian:#8EE6FF; --monRojo:#FF7A6B;
  --oro:#E0A21A;
  --fT:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --fB:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--txt)}
body{font-family:var(--fB);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--azul)}
:focus-visible{outline:3px solid var(--verde);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--fT);text-wrap:balance;margin:0;line-height:1.08}
h1{font-size:clamp(30px,6vw,46px);font-weight:700;color:var(--azul)}
h2{font-size:26px;font-weight:700;color:var(--azul)}
h3{font-size:19px;font-weight:600;letter-spacing:.2px}
h4{font-size:16px;font-weight:600;letter-spacing:.3px}
p{margin:0}
.eyebrow{font-family:var(--fT);font-weight:600;font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--verdeOsc)}
.muted{color:var(--suave)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.s8{gap:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--sup);border:1px solid var(--borde);border-radius:14px;padding:16px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.sep{height:1px;background:var(--borde);border:0;margin:4px 0}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--sup);box-shadow:0 2px 12px rgba(11,79,138,.09);padding-inline:16px}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:9px}
.marca{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.marca svg{width:36px;height:36px;flex:none}
.marca span{display:flex;flex-direction:column;line-height:1}
.marca b{font-family:var(--fT);font-weight:700;font-size:24px;color:var(--azul);letter-spacing:.3px}
.marca small{font-family:var(--fT);font-weight:600;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--oro);margin-top:2px}
.nav{display:flex;align-items:center;gap:4px;margin-left:auto}
.nav button.lnk{background:none;border:0;padding:8px 10px;border-radius:8px;font-weight:600;color:var(--suave);font-size:14px}
.nav button.lnk:hover,.nav button.lnk[aria-current=true]{color:var(--azul);background:var(--azulSuave)}
.menu-btn{display:none;margin-left:auto;background:var(--azulSuave);border:0;border-radius:9px;padding:8px 12px;font-weight:700;color:var(--azul)}
.reloj{font-family:var(--fT);font-weight:600;font-size:19px;color:var(--azul);background:var(--azulSuave);padding:4px 10px;border-radius:8px;font-variant-numeric:tabular-nums;margin-left:auto}
@media (max-width:820px){
  .menu-btn{display:block}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--sup);flex-direction:column;align-items:stretch;padding:8px 16px 14px;box-shadow:0 10px 18px rgba(11,79,138,.12)}
  .nav.abierto{display:flex}
  .nav button{text-align:left}
  .reloj{margin-left:0}
}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:22px 64px}
.wrap.estrecho{max-width:780px}

/* botones */
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;background:var(--azul);color:#fff;background-image:linear-gradient(135deg,var(--azul),var(--azul2));display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2}
.btn.verde{background:var(--verde);background-image:none}
.btn.verde:hover{background:var(--verdeOsc)}
.btn.sec{background:var(--sup);background-image:none;color:var(--azul);border:1px solid var(--borde)}
.btn.sec:hover{border-color:var(--azul)}
.btn.wa{background:var(--wa);background-image:none}
.btn.peligro{background:var(--rojo);background-image:none}
.btn.chico{padding:7px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--azulSuave);color:var(--azul);white-space:nowrap}
button.chip{white-space:normal;text-align:left;max-width:100%;border:0;cursor:pointer;line-height:1.3;border-radius:12px}
.clave-wrap{display:flex;gap:6px;align-items:stretch}.clave-wrap input{flex:1;min-width:0}.ojo{border:1px solid var(--borde,#d6dde4);background:#fff;border-radius:10px;padding:0 10px;font-size:12px;font-weight:600;color:var(--azul);cursor:pointer}
.sg-link{color:inherit;opacity:.35;text-decoration:none;font-size:12px}
.chip.v{background:var(--verdeSuave);color:var(--verdeOsc)}
.chip.g{background:var(--bg);color:var(--suave);border:1px solid var(--borde)}
.chip.r{background:var(--rojoSuave);color:var(--rojo)}
.chip.am{background:var(--ambarSuave);color:#7A4E0F}

/* formularios */
.campo{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;min-width:0}
.campo small{font-weight:400;color:var(--suave)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{padding:10px 12px;border:1px solid var(--borde);border-radius:10px;background:var(--sup);width:100%;min-width:0;font-weight:400}
textarea{min-height:120px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.check{display:flex;gap:9px;align-items:flex-start;font-weight:500;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--verde);flex:none}
.err{background:var(--rojoSuave);color:#7A2A20;border-radius:10px;padding:10px 12px;font-size:14px}
.ok{background:var(--verdeSuave);color:#0B5E50;border-radius:10px;padding:10px 12px;font-size:14px}
.info{background:var(--azulSuave);color:#0B3F6E;border-radius:10px;padding:10px 12px;font-size:14px}

/* pestañas */
.tabs{display:flex;gap:4px;background:var(--sup);border:1px solid var(--borde);border-radius:12px;padding:4px;overflow-x:auto}
.tab{border:0;background:transparent;border-radius:9px;padding:8px 12px;font-family:var(--fT);font-weight:600;font-size:16px;color:var(--suave);white-space:nowrap;flex:1 0 auto}
.tab[aria-selected=true]{background:var(--verde);color:#fff}
.tabs.t4{display:grid;grid-template-columns:repeat(4,1fr);overflow:visible}
.tabs.t4 .tab{padding:8px 4px;min-width:0;white-space:normal;line-height:1.1}
@media (max-width:420px){.tabs.t4 .tab{font-size:14px}}
.tab .n{display:block;font-family:var(--fB);font-size:11px;font-weight:500;opacity:.85}

/* tablas */
.tabla-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--suave);padding:10px 12px;border-bottom:1px solid var(--borde);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--borde);vertical-align:middle}
tr:last-child td{border-bottom:0}

/* medallas */
.medalla{display:inline-flex;flex:none}
.cat-txt{font-family:var(--fT);font-weight:700;letter-spacing:.4px}

/* portada */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;padding-block:10px 8px}
.hero p.lead{font-size:17px;color:var(--suave);max-width:58ch}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.mini-monitor{background:var(--monitor);border-radius:16px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 40px rgba(11,79,138,.18)}
.mini-monitor .linea{font-size:12px;color:var(--monTxt);display:flex;justify-content:space-between}
.esp-card{display:flex;flex-direction:column;gap:10px}
.esp-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--fT);font-weight:700;font-size:22px;color:#fff;background:linear-gradient(135deg,var(--azul),var(--azul2))}
.esp-ico.vet{background:linear-gradient(135deg,var(--verdeOsc),var(--verde))}
.pasos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pasos div{background:var(--azulSuave);border-radius:12px;padding:12px}
.pasos b{font-family:var(--fT);font-size:18px;color:var(--azul);display:block}
.pasos span{font-size:13px;color:var(--suave)}
.precio{display:flex;flex-direction:column;gap:8px}
.precio .valor{font-family:var(--fT);font-size:34px;font-weight:700;color:var(--azul);line-height:1}
.precio ul{margin:0;padding-left:18px;font-size:14px;color:var(--suave);display:flex;flex-direction:column;gap:4px}
.precio.destacado{border:2px solid var(--verde)}
.escala{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:620px){.escala{grid-template-columns:repeat(2,1fr)}}
.escala div{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--sup);border:1px solid var(--borde);border-radius:12px;padding:12px 6px}
.escala small{font-size:12px;color:var(--suave)}

/* cuadro de honor */
.podio{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end}
.podio .p{background:var(--sup);border:1px solid var(--borde);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.podio .p.primero{padding-block:22px;border:2px solid var(--oro)}
.podio .pos{font-family:var(--fT);font-weight:700;font-size:15px;color:var(--suave)}
.podio .nom{font-weight:700;font-size:15px;overflow-wrap:anywhere}
@media (max-width:560px){.podio{grid-template-columns:1fr}.podio .p.primero{order:-1}}
.fila-rank{display:grid;grid-template-columns:34px auto 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--borde)}
.fila-rank:last-child{border-bottom:0}
.fila-rank .pos{font-family:var(--fT);font-weight:700;font-size:18px;color:var(--suave);text-align:center}
.fila-rank .quien{min-width:0}
.fila-rank .quien b{display:block;overflow-wrap:anywhere}
.fila-rank .pts{text-align:right;font-variant-numeric:tabular-nums}
.fila-rank .pts b{font-family:var(--fT);font-size:20px;color:var(--azul)}

/* panel participante */
.esp-resumen{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.barra{height:8px;border-radius:99px;background:var(--azulSuave);overflow:hidden}
.barra i{display:block;height:100%;border-radius:99px;background:var(--verde)}
.caso-item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--borde)}
.caso-item:last-child{border-bottom:0}
.caso-item .cuerpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.nivel-tag{flex:none;width:46px;height:46px;border-radius:12px;background:var(--azulSuave);color:var(--azul);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fT);font-weight:700;line-height:1}
.nivel-tag small{font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:600}
.nivel-tag b{font-size:22px}
.caso-item.bloq{opacity:.6}
.insignias{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.insignia{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--borde);background:var(--sup);font-size:13px}
.insignia b{display:block;font-size:13px}
.insignia.no{opacity:.45;filter:grayscale(1)}
.ins-ico{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--verdeSuave);color:var(--verdeOsc);font-weight:700;font-family:var(--fT);font-size:15px}

/* avisos de cobro */
.aviso-cobro{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.aviso-cobro.rojo{background:var(--rojoSuave);border:1px solid #F1C6C0;color:#7A2A20}
.aviso-cobro.ambar{background:var(--ambarSuave);border:1px solid #F0DDAE;color:#6B4A10}
.cuenta-reg{font-family:var(--fT);font-weight:700;font-size:40px;line-height:1;color:var(--rojo)}
.bloqueo{text-align:center;align-items:center}

/* monitor y caso */
.monitor{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:10;background:var(--monitor);color:#fff;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mon-fila{display:grid;grid-template-columns:1fr 1.45fr 1fr 1fr 1fr;gap:6px}
.vit{display:flex;flex-direction:column;min-width:0}
.vit small{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--monTxt);font-weight:600}
.vit b{font-family:var(--fT);font-size:24px;line-height:1.1;font-weight:600;font-variant-numeric:tabular-nums}
.vit.fc b{color:var(--monVerde)} .vit.pa b{color:var(--monAzul)} .vit.fr b{color:var(--monAmbar)} .vit.t b{color:#fff} .vit.sat b{color:var(--monCian)}
.vit.alto b{color:var(--monRojo)}
.mon-oculto{font-size:13px;color:var(--monTxt);text-align:center;padding:8px 0}
.ecg{height:26px;width:100%;display:block}
.ecg path{fill:none;stroke:var(--monVerde);stroke-width:2;stroke-dasharray:6 900;animation:barrido 2.4s linear infinite}
@keyframes barrido{from{stroke-dashoffset:906}to{stroke-dashoffset:0}}
.ecg path.traza{stroke-opacity:.22;stroke-dasharray:none;animation:none}
.ecg path{stroke-dasharray:60 900}
.ecg.base path{stroke:var(--monLinea);stroke-dasharray:none;animation:none}
@media (prefers-reduced-motion:reduce){.ecg path{animation:none;stroke-dasharray:none}}
.estado{display:flex;align-items:center;gap:8px;font-size:12px}
.estado .bar{flex:1;height:8px;border-radius:99px;background:var(--monLinea);overflow:hidden}
.estado .bar i{display:block;height:100%;border-radius:99px;transition:width .5s,background .5s}
.estado em{font-style:normal;font-weight:700;min-width:84px;text-align:right}
.paciente{display:flex;gap:12px;align-items:center}
.avatar{flex:none;width:48px;height:48px;border-radius:50%;background:var(--verdeSuave);color:var(--verdeOsc);display:grid;place-items:center;font-family:var(--fT);font-weight:700;font-size:20px}
.paciente>div{min-width:0}
.acciones{display:flex;flex-direction:column;gap:8px}
.acc{display:flex;align-items:center;gap:10px;text-align:left;width:100%;background:var(--sup);border:1px solid var(--borde);border-radius:11px;padding:11px 12px}
.acc:hover:not(:disabled){border-color:var(--verde);background:var(--verdeSuave)}
.acc .min{margin-left:auto;flex:none;font-size:12px;color:var(--suave);font-variant-numeric:tabular-nums}
.acc.hecho{background:var(--bg);color:var(--suave)}
.acc.hecho::before{content:"✓";color:var(--verdeOsc);font-weight:700}
.acc:disabled{cursor:default}
.grupo-t{font-family:var(--fT);font-weight:600;font-size:14px;letter-spacing:1.2px;text-transform:uppercase;color:var(--suave);margin-top:6px}
.urg{border:1px solid #F1C6C0;background:var(--rojoSuave);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.urg p{font-size:13px;color:#7A2A20}
.pend{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pend span{font-size:12px;background:var(--ambarSuave);color:#7A4E0F;padding:4px 9px;border-radius:999px}
.log{display:flex;flex-direction:column;gap:8px}
.msg{border-radius:12px;padding:10px 12px;font-size:14px}
.msg .q{display:block;font-size:12px;font-weight:600;color:var(--suave);margin-bottom:3px}
.msg.pac{background:var(--verdeSuave);border-top-left-radius:4px}
.msg.exa{background:var(--azulSuave)}
.msg.lab{background:var(--sup);border:1px solid var(--borde)}
.msg.lab .q{color:var(--azul)}
.msg.evt{background:var(--ambarSuave);color:#6B4A10}
.msg.crit{background:var(--rojoSuave);color:#7A2A20;font-weight:600}
.msg .hora{float:right;font-size:11px;color:var(--suave);margin-left:8px;font-variant-numeric:tabular-nums}
.opc{display:flex;gap:10px;align-items:flex-start;background:var(--sup);border:1px solid var(--borde);border-radius:11px;padding:11px 12px;cursor:pointer;font-weight:500}
.opc input{margin-top:3px;accent-color:var(--verde);width:18px;height:18px;flex:none}
.opc:has(input:checked){border-color:var(--verde);background:var(--verdeSuave)}
.confirmar{border:2px solid var(--azul);background:var(--azulSuave);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* resultado */
.nota{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.anillo{width:110px;height:110px;flex:none}
.anillo text{font-family:var(--fT);font-weight:700}
.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.sec{background:var(--bg);border-radius:10px;padding:10px}
.sec small{display:block;font-size:12px;color:var(--suave)}
.sec b{font-family:var(--fT);font-size:22px;color:var(--azul);font-variant-numeric:tabular-nums}
.fb{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.fb li{display:flex;gap:8px;font-size:14px}
.fb li i{font-style:normal;font-weight:700;flex:none;width:18px}
.fb .ok i{color:var(--verdeOsc)} .fb .mal i{color:var(--rojo)} .fb .no{color:var(--suave)}
.perlas{background:var(--verdeSuave);border-radius:12px;padding:14px}
.perlas ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.logro{background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logro h3{color:#fff}
.logro .grande{font-family:var(--fT);font-size:40px;font-weight:700;line-height:1}
.constancia{border:2px solid var(--azul);border-radius:14px;padding:20px;background:var(--sup);display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center}
.constancia .nombre{font-family:var(--fT);font-size:30px;font-weight:700}

function todosLosCasos(){ return CASOS.concat(DB.casosExtra||[]); }
function casoActivo(c){ const e=(DB.casosEstado||{})[c.id]; return !e || e.activo!==false; }
const caso = id => todosLosCasos().find(c=>c.id===id);
const modId = (e,n) => e+"-n"+n;

function casosDeModulo(m){ const [e,n]=m.split("-n"); return todosLosCasos().filter(c=>c.esp===e && c.nivel===+n && casoActivo(c)).sort((a,b)=>(a.orden||0)-(b.orden||0)||a.titulo.localeCompare(b.titulo,"es")); }
function casosDeEsp(e){ return todosLosCasos().filter(c=>c.esp===e && casoActivo(c)); }
function modulo(m){ const [e,n]=m.split("-n"); const E=esp(e); const cs=casosDeModulo(m); return {id:m, esp:e, nivel:+n, nombre:E.n+" · Nivel "+n, nivelTxt:NIVELES[n], casos:cs, disponible:cs.length>0, completo:cs.length>=CASOS_POR_MODULO}; }
function modulosDe(e){ return [1,2,3].map(n=>modulo(modId(e,n))); }
function modulosDisponibles(){ return ESPECIALIDADES.filter(e=>!e.pronto).flatMap(e=>modulosDe(e.id)).filter(m=>m.disponible); }
/* Caso de la semana: casos con estudio clínico real, programados por fecha (campo "semana", lunes). */
function casosSemanales(){ return todosLosCasos().filter(c=>c.semana && casoActivo(c)).sort((a,b)=>a.semana.localeCompare(b.semana)); }
function casoSemana(){
  const L=lunesDe(hoy()), cs=casosSemanales();
  if(PROD && DB.config.semanaId){ const f=caso(DB.config.semanaId); if(f) return f; }   /* producción: lo decide la base */

}

/* ---------- cobro: regla SkyNet Genesis (sin mora: se cierra el día 5 del mes siguiente) ---------- */
function limiteCierre(ph){ const d=aFecha(ph); return aIso(new Date(d.getFullYear(), d.getMonth()+1, 5)); }
function estadoCobro(ph, prueba, interna){
  if(interna) return {e:"activa", acceso:true, txt:"Activa · interna (sin cobros)", chip:"v", interna:true};
  const H=hoy();
  if(ph && H<=ph) return {e:"activa", acceso:true, txt:"Activa", chip:"v"};
  if(prueba && H<=prueba && !ph){ const n=difDias(prueba,H)+1; return {e:"prueba", acceso:true, dias:n, txt:"En prueba: "+n+(n===1?" día":" días"), chip:"am"}; }
  if(ph){ const lim=limiteCierre(ph); if(H<lim) return {e:"pendiente", acceso:true, lim, txt:"Activa · pagar antes del "+fechaCorta(lim), chip:"am"}; return {e:"cerrada", acceso:false, txt:"Cerrada por pago", chip:"r"}; }
  if(prueba) return {e:"cerrada", acceso:false, txt:"Prueba terminada", chip:"r"};
  return {e:"sin", acceso:false, txt:"Sin plan", chip:"g"};
}

function compraDe(uId, m){ return DB.compras.filter(c=>c.usuarioId===uId && c.modulo===m).sort((a,b)=>b.hasta.localeCompare(a.hasta))[0]; }
function accesoModulo(u, m){
  if(!u) return {ok:false};
  if(u.tipo==="superadmin") return {ok:true, via:"superadmin"};
  const c=compraDe(u.id,m);
  if(c && hoy()<=c.hasta) return {ok:true, via:"compra", hasta:c.hasta};
  if(u.entidadId){ const en=entidad(u.entidadId); if(en && modulosEntidad(en,true).includes(m)){ const st=estadoCobro(en.pagadoHasta,en.pruebaHasta,en.interna); if(st.acceso && modulosEntidad(en).includes(m)) return {ok:true, via:"institucion", ent:en, st}; return {ok:false, via:"institucion-cerrada", ent:en, st}; } }
  if(c) return {ok:false, via:"vencida", hasta:c.hasta};
  return {ok:false};
}
function enPrueba(u){ return esParticipante(u) && u.pruebaHasta && hoy()<=u.pruebaHasta; }
function accesoCaso(u, c){
  if(c.gratis || (casoSemana()||{}).id===c.id) return {ok:true, via:"gratis"};
  if(c.semana && u && esParticipante(u) && c.semana<=lunesDe(hoy())) return {ok:true, via:"semana"};
  if(c.semana && u && u.tipo==="superadmin") return {ok:true, via:"superadmin"};
  if(!u) return {ok:false};
  const a=accesoModulo(u, modDeCaso(c)); if(a.ok) return a;
  if(enPrueba(u)){ const cs=casosDeModulo(modDeCaso(c)).slice(0,3).map(x=>x.id); if(cs.includes(c.id)) return {ok:true, via:"prueba"}; }
  return a;
}

function precioModulo(u){ const P=DB.config.precios; return u && u.tipo==="estudiante" ? Math.round(P.modulo*(100-P.descEstudiante)/100/1000)*1000 : P.modulo; }
/* Instituciones: cobro por usuario con descuento por volumen (la institución escoge cuántas personas) */
function tarifaPP(n){ const T=DB.config.precios.tramos; return (T.find(t=>n<=t.hasta)||T[T.length-1]).pp; }
function mensualidad(n){ return n*tarifaPP(n); }
const MIN_USU = () => DB.config.precios.minUsuarios, MAX_USU = () => DB.config.precios.tramos[DB.config.precios.tramos.length-1].hasta;
/* si por el descuento por volumen más personas cuestan menos, se asignan esas personas (nunca se cobra más por menos cupos) */
function mejorCupos(n){ let c=n; DB.config.precios.tramos.slice().sort((a,b)=>a.hasta-b.hasta).forEach(t=>{ const k=t.hasta+1; if(c<k && k<=MAX_USU() && mensualidad(k)<=mensualidad(c)) c=k; }); return c; }
const ajustarCupos = n => mejorCupos(Math.max(MIN_USU(), Math.min(MAX_USU(), Math.round(+n||0))));
function planDe(en){ const n=en.cupos||MIN_USU(); return {n:n+" personas", hasta:n, mes:mensualidad(n), pp:tarifaPP(n)}; }
function correoInstitucional(c){ return /\.edu(\.[a-z]{2})?$/i.test(String(c).split("@")[1]||""); }

/* ---------- puntos, categorías e insignias ---------- */
const APRUEBA = 70;
function intentosDe(uId, e){ return DB.intentos.filter(i=>i.usuarioId===uId && (!e || i.esp===e)); }
function mejores(uId, e){ const m={}; intentosDe(uId,e).forEach(i=>{ if(!m[i.casoId] || i.puntaje>m[i.casoId].puntaje) m[i.casoId]=i; }); return m; }
function stats(uId, e){
  const lista=casosDeEsp(e), N=lista.length, m=mejores(uId,e);
  const hechos=lista.filter(c=>m[c.id]), aprob=hechos.filter(c=>m[c.id].puntaje>=APRUEBA);
  const prom=hechos.length?Math.round(hechos.reduce((a,c)=>a+m[c.id].puntaje,0)/hechos.length):0;
  let puntos=0; hechos.forEach(c=>{ const b=m[c.id]; puntos+=b.puntaje; if(b.puntaje>=85) puntos+=10; if(intentosDe(uId,e).some(i=>i.casoId===c.id && i.puntaje>=APRUEBA && !i.crisis)) puntos+=10; });
  const sinCrisis=aprob.every(c=>!m[c.id].crisis), a=aprob.length;
  let k="ninguna";
  if(hechos.length) k="bronce";
  if(N && a>=Math.ceil(N*.5) && prom>=60) k="plata";
  if(N && a>=Math.ceil(N*.75) && prom>=70) k="oro";
  if(N && a===N && prom>=80) k="platino";
  if(N && a===N && prom>=90 && sinCrisis) k="diamante";
  return {N, hechos:hechos.length, aprobados:a, prom, puntos, cat:k, mejores:m};
}
function siguienteCat(st){
  const N=st.N; if(!N) return null;
  const R={bronce:"Complete su primer caso.", plata:"Apruebe "+Math.ceil(N*.5)+" de "+N+" casos con promedio de 60 o más.", oro:"Apruebe "+Math.ceil(N*.75)+" de "+N+" casos con promedio de 70 o más.", platino:"Apruebe los "+N+" casos con promedio de 80 o más.", diamante:"Apruebe los "+N+" casos con promedio de 90 o más, sin pacientes complicados."};
  const o=["bronce","plata","oro","platino","diamante"], i=o.indexOf(st.cat);
  return i===o.length-1 ? null : {id:o[i+1], n:cat(o[i+1]).n, txt:R[o[i+1]]};
}
function progresoModulo(uId, m){ const cs=casosDeModulo(m), b=mejores(uId, m.split("-n")[0]); const ap=cs.filter(c=>b[c.id] && b[c.id].puntaje>=APRUEBA).length; const he=cs.filter(c=>b[c.id]).length; const prom=he?Math.round(cs.filter(c=>b[c.id]).reduce((a,c)=>a+b[c.id].puntaje,0)/he):0; return {total:cs.length, hechos:he, aprobados:ap, prom, completo:cs.length>0 && ap===cs.length}; }

function actividad(uId){ DB.actividad[uId]=DB.actividad[uId]||{ultimo:null, racha:0, protectores:1, div:1}; return DB.actividad[uId]; }
function registrarEntrada(u){
  if(!esParticipante(u)) return null;
  const a=actividad(u.id), H=hoy(); if(a.ultimo===H) return null;
  let msg;
  if(a.ultimo && difDias(H,a.ultimo)===1) a.racha++;
  else if(a.ultimo && difDias(H,a.ultimo)===2 && a.protectores>0){ a.protectores--; a.racha++; msg="Usó un protector de racha: su racha sigue viva."; }
  else a.racha=1;
  a.ultimo=H;
  const extra=Math.min(GEMAS.rachaMax, (a.racha-1)*GEMAS.rachaDia);
  darGemas(u.id, GEMAS.entrar+extra, "Entrada del día"+(a.racha>1?" · racha de "+a.racha+" días":""));
  return msg || ("+"+(GEMAS.entrar+extra)+" gemas por entrar hoy"+(a.racha>1?" · racha de "+a.racha+" días":""));

function insigniasDe(uId){
  const it=intentosDe(uId), ok=new Set();
  if(it.length) ok.add("primer");
  if(it.some(i=>i.puntaje>=APRUEBA && !i.crisis)) ok.add("estable");
  const prim={}; it.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(i=>{ if(!prim[i.casoId]) prim[i.casoId]=i; });
  if(Object.values(prim).some(i=>i.dxOk)) ok.add("ojo");
  if(it.some(i=>i.puntaje>=95)) ok.add("perfecto");
  if(it.filter(i=>i.calcOk).length>=5) ok.add("calculo");
  if(it.some(i=>i.modo==="examen" && i.puntaje>=APRUEBA)) ok.add("examen");
  if((actividad(uId).racha||0)>=7) ok.add("racha7");
  if(modulosDisponibles().some(m=>progresoModulo(uId,m.id).completo)) ok.add("modulo");
  if(new Set(it.map(i=>i.esp)).size>=2) ok.add("multi");
  if(it.length>=100) ok.add("cien");
  return ok;
}

function miembros(entId){ return DB.usuarios.filter(u=>u.entidadId===entId && esParticipante(u)); }
/* módulos con los que trabaja la institución: los pagados y, en la prueba, los de prueba */
function modulosEntidad(en, todos){ if(en.interna) return (en.modsInterna&&en.modsInterna.length?en.modsInterna:modulosDisponibles().map(m=>m.id)); const st=estadoCobro(en.pagadoHasta,en.pruebaHasta,en.interna); const p=(todos||st.e==="prueba"||(en.pruebaHasta&&hoy()<=en.pruebaHasta))?(en.prueba||[]):[]; return [...new Set(en.modulos.concat(p))]; }
function espsDeEntidad(en){ return [...new Set(modulosEntidad(en,true).map(m=>m.split("-n")[0]))]; }
function nivelEntidad(entId, e){
  const en=entidad(entId); if(!en) return null;
  const es=e?[e]:espsDeEntidad(en), ms=miembros(entId);
  if(!ms.length || !es.length) return {cat:"ninguna", activos:0, total:ms.length, prom:0, partic:0};
  let act=0, s=0, n=0;
  ms.forEach(u=>{ let a=false; es.forEach(x=>{ const st=stats(u.id,x); if(st.hechos){ a=true; s+=st.prom; n++; } }); if(a) act++; });
  const partic=Math.round(act/ms.length*100), prom=n?Math.round(s/n):0;
  let c="ninguna"; if(act) c="bronce"; if(partic>=30&&prom>=60) c="plata"; if(partic>=50&&prom>=70) c="oro"; if(partic>=70&&prom>=80) c="platino"; if(partic>=80&&prom>=90) c="diamante";
  return {cat:c, activos:act, total:ms.length, prom, partic};
}

/* ===================== Entrenamiento Clínico-IA · PRODUCCIÓN (Neon Auth + Data API) =====================
   En la vista previa de Claude (PROD=false) todo funciona en el navegador con datos de ejemplo.
   En producción (PROD=true) la base de datos de Neon guarda y valida todo: acceso a casos, gemas, pagos y cobro. */
let MODO = PROD ? "publico" : "local";            // publico | demo | real | local
const REAL = () => PROD && MODO === "real";

function limpiarErr(m){
  m = String(m||"No se pudo completar. Intente de nuevo.");
  if(/SIN_ACCESO/.test(m)) return "SIN_ACCESO";
  if(/JWT|token|401|permission denied/i.test(m)) return "Su sesión venció. Ingrese de nuevo.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Sin conexión. Revise su internet e intente de nuevo.";
  return m.replace(/^.*?ERROR:\s*/,"");
}
async function neon(){
  if(NEON) return NEON;
  const m = await import("https://esm.sh/@neondatabase/neon-js@0.7.0-beta");
  NEON = m.createClient({ auth:{ url:CFG.AUTH_URL, allowAnonymous:true }, dataApi:{ url:CFG.DATA_URL } });
  return NEON;
}
async function rpc(fn, args){
  if(CFG.test){
    const r = await fetch(CFG.DATA_URL+"/rpc/"+fn, {method:"POST", headers:Object.assign({"content-type":"application/json"}, TEST_USER?{"x-test-user":TEST_USER}:{}), body:JSON.stringify(args||{})});
    const j = await r.json().catch(()=>null);
    if(!r.ok) throw new Error(limpiarErr(j&&j.message));
    if(j && typeof j==="object" && j.error && Object.keys(j).length===1) throw new Error(j.error);
    return j;
  }
  const db = await neon();
  const { data, error } = await db.rpc(fn, args||{});
  if(error) throw new Error(limpiarErr(error.message));
  if(data && typeof data==="object" && data.error && Object.keys(data).length===1) throw new Error(data.error);   /* error con conteo (p. ej. código equivocado) */
  return data;
}

/* ---------- inicio de sesión (Neon Auth) ---------- */
async function authPost(ruta, datos){
  const r = await fetch(CFG.AUTH_URL+ruta, {method:"POST", credentials:"include", headers:{"content-type":"application/json"}, body:JSON.stringify(datos)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(authMsg(j));
  return j;
}
function authMsg(e){
  const c=String(e&&e.code||"").toUpperCase(), m=String(e&&e.message||"");
  if(c.includes("INVALID_EMAIL_OR_PASSWORD")||/invalid (email|password)/i.test(m)) return "El correo o la contraseña no coinciden. Revise e intente de nuevo.";
  if(c.includes("USER_ALREADY_EXISTS")||/already exists/i.test(m)) return "Ya existe una cuenta con ese correo. Ingrese o recupere su contraseña.";
  if(c.includes("PASSWORD_TOO_SHORT")) return "La contraseña debe tener al menos 10 caracteres.";
  if(c.includes("TOO_MANY")||/too many/i.test(m)) return "Demasiados intentos. Espere 15 minutos e intente de nuevo.";
  return m || "No se pudo completar. Intente de nuevo.";
}
async function authLogin(email, clave){

  const db=await neon(); const { error } = await db.auth.signIn.email({ email, password:clave });
  if(error) throw new Error(authMsg(error));
  NEON=null;   /* la conexión nueva toma el token de la sesión, no el anónimo guardado */
}

}

/* Reglas de contraseña (directiva): mínimo 10 caracteres, con letras y números, escrita dos veces */
function errClave(c, email){
  if(c.length<10) return "La contraseña debe tener al menos 10 caracteres.";
  if(!/[a-zñ]/i.test(c)||!/\d/.test(c)) return "La contraseña debe tener letras y números.";
  if(/(.)\1\1\1/.test(c)) return "La contraseña no puede repetir el mismo carácter tantas veces.";
  const sec="0123456789 abcdefghijklmnopqrstuvwxyz qwertyuiopasdfghjklzxcvbnm", t=c.toLowerCase();
  for(let i=0;i+5<=t.length;i++){ const w=t.slice(i,i+5); if(sec.includes(w)||sec.includes([...w].reverse().join(""))) return "La contraseña no puede tener secuencias como 12345 o abcde."; }
  if(email && t.includes(String(email).split("@")[0].toLowerCase())) return "La contraseña no debe contener su correo.";
  return "";
}

/* Al volver de Bold: el pago se aplica cuando Bold avisa (normalmente en segundos). Se revisa varias veces. */
/* Si el aviso de Bold no llega, la app le pide a skynetgenesis.com que consulte a Bold y deje el pago registrado. */
async function verificarBold(ref){
  if(!ref) return false;
  try{ const r=await fetch("https://skynetgenesis.com/bold-verificar.php?ref="+encodeURIComponent(ref)+"&app=entrenamiento-clinico-ia",{cache:"no-store"}); return r.ok; }catch(e){ return false; }
}
async function esperarPago(refQs){
  let pend=null; try{ pend=JSON.parse(localStorage.getItem("eci_pago_pend")||"null"); }catch(e){}
  const ref = refQs || (pend&&pend.orden) || "";
  if(!pend){ verificarBold(ref); return; }
  toast("Estamos confirmando su pago con Bold…");
  let registrado=false;
  for(let i=0;i<12;i++){
    if(!registrado && i%2===0) registrado = await verificarBold(ref);
    await new Promise(r=>setTimeout(r, 5000));
    try{ await cargarEstado(); }catch(e){ continue; }
    const pd = (ESTADO.pedidosPendientes||[]).find(p=>p.id===pend.pedido);
    if(pd && pd.estado==="revisar"){ try{ localStorage.removeItem("eci_pago_pend"); }catch(e){} toast("Recibimos su pago y lo estamos revisando. Le escribiremos pronto; si tiene dudas, escríbanos por WhatsApp."); return; }
    if(!pd){ try{ localStorage.removeItem("eci_pago_pend"); }catch(e){} const u=sesion(); if(u){ DB.carrito[u.id]=[]; guardarDB(); } render(); toast("Pago aprobado. Ya está activo."); return; }
  }
  toast(registrado ? "Bold ya confirmó su pago. Se activará en los próximos 10 minutos; recargue la página entonces." : "Bold aún no confirma el pago. Si ya pagó, se activará en unos minutos; si no, puede intentarlo de nuevo.");
}

async function traerHonor(e, t){

function statsHonor(p, e){
  const lista=casosDeEsp(e), N=lista.length, m={}; (p.mejores||[]).forEach(([c,pt,x,est])=>{ m[c]={puntaje:pt, crisis:x, est}; });
  const hechos=lista.filter(c=>m[c.id]), aprob=hechos.filter(c=>m[c.id].puntaje>=APRUEBA);
  const prom=hechos.length?Math.round(hechos.reduce((a,c)=>a+m[c.id].puntaje,0)/hechos.length):0;
  let puntos=0; hechos.forEach(c=>{ const b=m[c.id]; puntos+=b.puntaje; if(b.puntaje>=85) puntos+=10; if(b.est) puntos+=10; });
  const a=aprob.length, sinCrisis=aprob.every(c=>!m[c.id].crisis);
  let k="ninguna"; if(hechos.length) k="bronce"; if(N&&a>=Math.ceil(N*.5)&&prom>=60) k="plata"; if(N&&a>=Math.ceil(N*.75)&&prom>=70) k="oro"; if(N&&a===N&&prom>=80) k="platino"; if(N&&a===N&&prom>=90&&sinCrisis) k="diamante";
  return {N, hechos:hechos.length, aprobados:a, prom, puntos, cat:k};
}

/* ===================== Entrenamiento Clínico-IA · MOTOR DE SIMULACIÓN ===================== */
const COSTO_BASE = {pregunta:2, examen:3, orden:2, esperar:10};
const ETQ_BASE = {int:"Interrogar", exa:"Examinar", lab:"Exámenes", dx:"Decidir"};
const esAuxiliar = c => ["aux","auxenf","enfp","psico"].includes(c.esp);
let S = null;

function nuevoTurno(c, modo){
  return {c, modo, costo:Object.assign({},COSTO_BASE,c.costos||{}), etq:Object.assign({},ETQ_BASE,c.etiquetas||{}),
    min:0, dano:0, preg:new Set(), exam:new Set(), orden:{}, vistos:new Set(), vitales:false,
    tRescate:null, crit:false, avisado:false, log:[{tipo:"evt", txt:c.presentacion, min:0}],
    dx:null, dif:new Set(), calc:"", plan:new Set(), confirmando:false, tab:"int", interconsultas:0,
    marca:1, paso:0, resExa:{}, ultimo:null, masMin:0, vPrev:null, acc:[]};
}
function estabilidad(){
  const f=S.c.fisio; let e=f.base;
  if(S.tRescate===null) e -= S.min*f.caida;
  else { e -= S.tRescate*f.caida; e += Math.min(10,(S.min-S.tRescate)*f.recupera); }
  e -= S.dano;
  return Math.max(0, Math.min(100, Math.round(e)));
}
const enCrisis = () => S.crit && S.tRescate===null;
function vitalesAhora(){
  const f=S.c.fisio;
  if(enCrisis()){ const v=f.vitCrit; return {fc:v.fc, pas:v.pas, pad:v.pad, fr:v.fr, t:v.t, sat:v.sat}; }
  const d=Math.max(0, f.base-estabilidad()), b=f.vit, k=f.dvit;
  return {fc:Math.round(b.fc+d*(k.fc||0)), pas:Math.round(b.pas+d*(k.pas||0)), pad:Math.round(b.pad+d*(k.pad||0)), fr:Math.round(b.fr+d*(k.fr||0)), t:b.t, sat:Math.max(f.satMin||80, Math.min(100, Math.round(b.sat+d*(k.sat||0))))};
}
function llenar(tpl){
  const v=vitalesAhora();
  const m={fc:v.fc, pa:v.pas+"/"+v.pad, pas:v.pas, pad:v.pad, fr:v.fr, t:v.t, sat:v.sat, pasPie:v.pas-14, padPie:Math.max(50,v.pad-8), fcPie:v.fc+16};
  return tpl.replace(/\{(\w+)\}/g,(x,k)=>m[k]!==undefined?m[k]:x);
}
function avanzar(m){
  S.min += m; S.masMin=(S.masMin||0)+m;
  Object.entries(S.orden).filter(([id,h])=>h<=S.min && !S.vistos.has(id)).sort((a,b)=>a[1]-b[1]).forEach(([id,h])=>{
    const L=S.c.laboratorios.find(x=>x.id===id); S.vistos.add(id);
    S.log.push({tipo:"lab", lid:id, q:(esAuxiliar(S.c)?"Listo: ":"Resultado: ")+L.t, txt:(enCrisis()&&L.rCrit)?L.rCrit:L.r, min:h});
  });
  const e=estabilidad(), f=S.c.fisio;
  if(!S.avisado && e<f.aviso && !S.crit){ S.avisado=true; S.log.push({tipo:"evt", aviso:true, txt:f.avisoTxt, min:S.min}); }
  if(!S.crit && e<f.crit){ S.crit=true; S.log.push({tipo:"crit", txt:f.critTxt, min:S.min}); }
}

  const r=document.getElementById("reloj"); if(r){ r.innerHTML=hhmm(S.min)+(S.masMin?`<span class="mas-min">+${S.masMin} min</span>`:""); }
  S.masMin=0; S.vPrev=S.vitales?vitalesAhora():null;

function interconsulta(){
  const c=S.c, ideas=[];
  if(S.tRescate===null) ideas.push("No espere a tener todo: hay una acción inmediata que su paciente necesita.");
  const fp=c.preguntas.filter(p=>p.key && !S.preg.has(p.id)).slice(0,1).map(p=>"Pregunte: «"+p.t+"»");
  const fe=c.examen.filter(p=>p.key && !S.exam.has(p.id)).slice(0,1).map(p=>"Revise: "+p.t.toLowerCase());
  const fl=c.laboratorios.filter(l=>l.tipo==="esencial" && !(l.id in S.orden)).slice(0,1).map(l=>(c.esp==="auxenf"?"Aliste: ":esAuxiliar(c)?"Considere: ":"Pida: ")+l.t.toLowerCase());
  return ideas.concat(fp,fe,fl).slice(0,3);
}
function accionCaso(act, id){
  const c=S.c, k=S.costo;
  if(["preg","exa","lab","esperar","rescate","interconsulta"].includes(act)) S.marca=S.log.length;
  if(act==="tab"){ S.tab=id; S.confirmando=false; S.ultimo=null; S.marca=S.log.length; }
  else if(act==="paso"){ S.paso=+id; S.confirmando=false; }
  else if(act==="preg"){ if(S.preg.has(id)) return; const p=c.preguntas.find(x=>x.id===id); S.preg.add(id); S.acc.push(["p",id]); S.ultimo="p:"+id; S.log.push({tipo:"pac", q:p.t, txt:p.r, min:S.min+k.pregunta}); avanzar(k.pregunta); }
  else if(act==="exa"){
    if(S.exam.has(id)) return; const p=c.examen.find(x=>x.id===id); S.exam.add(id); S.acc.push(["e",id]); let txt;
    if(p.vitales){ S.vitales=true; const v=vitalesAhora(); txt=`FC ${v.fc} lpm, PA ${v.pas}/${v.pad} mmHg, FR ${v.fr} rpm, T ${v.t} °C, SpO₂ ${v.sat} %. Monitor conectado.`; }
    else if(p.tpl) txt=llenar(enCrisis()&&p.tplCrit?p.tplCrit:p.tpl);
    else txt=enCrisis()&&p.rCrit?p.rCrit:p.r;
    S.resExa[id]=txt; S.ultimo="e:"+id; S.log.push({tipo:"exa", q:p.t, txt, min:S.min+k.examen}); avanzar(k.examen);
  }
  else if(act==="lab"){ if(id in S.orden) return; const l=c.laboratorios.find(x=>x.id===id); S.acc.push(["l",id]); S.orden[id]=S.min+k.orden+l.min; if(l.dano) S.dano+=l.dano; S.ultimo="o:"+id; S.log.push({tipo:"evt", orden:true, txt:(esAuxiliar(c)?"Usted: ":"Ordenó: ")+l.t+".", min:S.min+k.orden}); avanzar(k.orden); }
  else if(act==="esperar"){ S.acc.push(["w"]); avanzar(k.esperar); }
  else if(act==="rescate"){ if(S.tRescate!==null) return; S.acc.push(["r"]); S.tRescate=S.min; if(c.rescate.plan) S.plan.add(c.rescate.plan); S.log.push({tipo:"evt", txt:"✓ "+c.rescate.log, min:S.min}); avanzar(2); toast("Acción inmediata realizada: el paciente deja de deteriorarse."); }
  else if(act==="interconsulta"){
    const u=sesion();
    if(S.modo==="examen") return;
    const dar=()=>{ S.interconsultas++; const ideas=interconsulta();
      S.log.push({tipo:"ic", q:"Interconsulta con un colega", txt:ideas.length?ideas.join(" · "):"Va por buen camino. Revise su plan antes de confirmar.", min:S.min}); };
    if(u && esParticipante(u)){ if(gemasDe(u.id)<GEMAS.interconsulta){ toast("No le alcanzan las gemas para una interconsulta. Gánelas resolviendo casos."); return; }
      if(REAL()){ const t=S; rpc("gastar_interconsulta",{p_caso:c.id}).then(r=>{ darGemas(u.id,-GEMAS.interconsulta,"Interconsulta en "+c.titulo); pintarBarra();
          if(S===t){ (r.p||[]).forEach(id=>{ const q=c.preguntas.find(x=>x.id===id); if(q) q.key=true; }); (r.e||[]).forEach(id=>{ const q=c.examen.find(x=>x.id===id); if(q) q.key=true; }); (r.l||[]).forEach(id=>{ const q=c.laboratorios.find(x=>x.id===id); if(q) q.tipo="esencial"; }); dar(); pintarCaso(); } }).catch(e=>toast(limpiarErr(e.message))); return; }
      darGemas(u.id,-GEMAS.interconsulta,"Interconsulta en "+c.titulo); guardarDB(); }
    dar();
  }
  else if(act==="terminar"){ if(!S.dx){ S.paso=0; pintarCaso(); toast("Primero elija el diagnóstico."); return; } S.confirmando=true; pintarCaso(); const b=document.getElementById("confirmar"); if(b) b.scrollIntoView({block:"center"}); return; }
  else if(act==="seguir") S.confirmando=false;
  else if(act==="fin"){ terminarCaso(); return; }
  else if(act==="abandonar"){ abrirModal(`<div class="modal-cab"><h3>¿Salir del caso?</h3></div><p>El turno no se guardará ni sumará puntos.</p><div class="row"><button class="btn peligro" data-act="salir-caso">Salir sin guardar</button><button class="btn sec" data-act="cerrar-modal">Seguir en el caso</button></div>`); return; }
  pintarCaso();
}

/* número escrito en el cálculo (punto de miles, coma decimal) */
function numCalc(x){ let t=String(x==null?"":x).trim().replace(/\s/g,""); if(!t) return null;
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t=t.replace(/\./g,"").replace(",",".");   /* 1.250 o 1.250,5: punto de miles */
  else t=t.replace(",",".");                                                     /* 0,5 o 0.5: decimal */
  const v=parseFloat(t); return isNaN(v)?null:v; }
/* lo que se envía a la base para que ella recalcule el puntaje */
function accionesTurno(){ return {a:S.acc, dx:S.dx, dif:[...S.dif], plan:[...S.plan], calc:S.c.calculo?numCalc(S.calc):null}; }
/* ---------- calificación (sobre 100) ---------- */
function calificar(){
  const c=S.c, out={secs:{}, fb:{}, total:0};
  const kp=c.preguntas.filter(p=>p.key);
  out.secs.int=Math.round(kp.filter(p=>S.preg.has(p.id)).length/kp.length*20); out.fb.int=kp.map(p=>({ok:S.preg.has(p.id), txt:p.nota}));
  const ke=c.examen.filter(p=>p.key);
  out.secs.exa=Math.round(ke.filter(p=>S.exam.has(p.id)).length/ke.length*20); out.fb.exa=ke.map(p=>({ok:S.exam.has(p.id), txt:p.nota}));
  let lab=0; const fbL=[];
  if(c.labsMinimos){
    lab=20; fbL.push({ok:true, txt:"En este caso no se requerían exámenes de rutina para decidir."});
    c.laboratorios.forEach(l=>{ const p=l.id in S.orden;
      if(l.tipo==="util"&&p) fbL.push({ok:true, txt:l.t+": "+l.nota});
      if(l.tipo==="neutral"&&p){ lab-=2; fbL.push({mal:true, txt:l.t+": no era necesario en este momento (−2)."}); }
      if(l.tipo==="innecesario"&&p){ lab-=5; fbL.push({mal:true, txt:l.nota+" (−5)"}); } });
  } else {
    const nE=c.laboratorios.filter(l=>l.tipo==="esencial").length, nU=c.laboratorios.filter(l=>l.tipo==="util").length, pE=nE?(20-2*nU)/nE:0;
    c.laboratorios.forEach(l=>{ const p=l.id in S.orden;
      if(l.tipo==="esencial"){ if(p) lab+=pE; fbL.push({ok:p, txt:l.t+": "+l.nota}); }
      if(l.tipo==="util"){ if(p) lab+=2; fbL.push({ok:p, txt:l.t+": "+l.nota}); }
      if(l.tipo==="innecesario"&&p){ lab-=3; fbL.push({mal:true, txt:l.nota}); } });
  }
  out.secs.lab=Math.max(0,Math.min(20,Math.round(lab))); out.fb.lab=fbL;
  /* diagnóstico: principal (hasta 16) + diferenciales (hasta 4) */
  const crit=S.crit, tabla=crit?c.dxPts.crit:c.dxPts.normal, base=tabla[S.dx]||0;
  out.dxOk=base===20;
  const elegido=(c.diagnosticos.find(d=>d.id===S.dx)||{}).t||"Ninguno";
  out.fb.dx=[{ok:out.dxOk, txt:"Usted eligió: "+elegido+". Respuesta esperada: "+(crit?c.dxEsperado.crit:c.dxEsperado.normal)+"."}];
  if(c.diferenciales && c.diferenciales.length){
    let d=0; const buenos=c.diferenciales;
    S.dif.forEach(x=>{ if(buenos.includes(x)) d+=2; else if(x!==S.dx) d-=1; });
    d=Math.max(0,Math.min(4,d));
    out.secs.dx=Math.round(base*0.8)+d;
    out.fb.dx.push({ok:d>=4, txt:"Diferenciales que un buen clínico considera: "+buenos.map(x=>(c.diagnosticos.find(y=>y.id===x)||{}).t).join(", ")+". Su puntaje en diferenciales: "+d+"/4."});
  } else out.secs.dx=base;
  /* plan (+ cálculo) */
  let plan=0; const fbP=[];
  c.plan.forEach(p=>{
    const m=S.plan.has(p.id)||(c.rescate&&p.id===c.rescate.plan&&S.tRescate!==null);
    let pts=p.pts||0, dano=p.dano||0, nota=p.nota;
    if(crit&&p.crit){ if(p.crit.pts!==undefined) pts=p.crit.pts; if(p.crit.dano!==undefined) dano=p.crit.dano; if(p.crit.nota) nota=p.crit.nota; }
    if(crit&&S.tRescate===null&&p.critSinRescate&&p.critSinRescate.pts!==undefined) pts=p.critSinRescate.pts;
    if(pts>0){ if(m) plan+=pts; fbP.push({ok:m, txt:p.t+". "+nota}); }
    else if(dano>0&&m){ plan-=dano; fbP.push({mal:true, txt:p.t+". "+nota}); }
  });
  plan=Math.max(0,Math.min(20,plan));
  if(c.calculo){
    const v=numCalc(S.calc);
    const ok=v!==null && v>=c.calculo.min && v<=c.calculo.max; out.calcOk=ok;
    plan=Math.round(plan*0.8)+(ok?4:0);
    fbP.unshift({ok, mal:!ok&&S.calc!=="", txt:"Cálculo: "+(S.calc===""?"no respondió":"respondió "+S.calc+" "+c.calculo.unidad)+". Correcto: "+(c.calculo.min===c.calculo.max?num(c.calculo.min):num(c.calculo.min)+" a "+num(c.calculo.max))+" "+c.calculo.unidad+". "+c.calculo.exp});
  }
  out.secs.plan=plan; out.fb.plan=fbP;
  let aj=0; const fbT=[];
  if(S.tRescate!==null&&!S.crit){ aj+=5; fbT.push({ok:true, txt:"Actuó a tiempo ("+hhmm(S.tRescate)+"): el paciente dejó de deteriorarse. Bono +5."}); }
  if(S.tRescate!==null&&S.crit) fbT.push({mal:true, txt:"La acción inmediata llegó tarde ("+hhmm(S.tRescate)+"), cuando el paciente ya se había complicado."});
  if(S.crit){ aj-=15; fbT.push({mal:true, txt:"El paciente se complicó mientras se completaba la evaluación (−15). Con un paciente complicado el máximo es 84."}); }
  if(S.dano>0) fbT.push({mal:true, txt:"Algunas decisiones retrasaron la atención y empeoraron al paciente."});
  if(S.interconsultas) fbT.push({txt:"Usó "+S.interconsultas+(S.interconsultas===1?" interconsulta.":" interconsultas.")});
  fbT.push({ok:S.min<=c.tiempoMeta*2, txt:"Tiempo total del caso: "+hhmm(S.min)+" (referencia: "+c.tiempoMeta+" min)."});
  out.fb.t=fbT; out.ajuste=aj;
  out.total=Math.max(0,Math.min(S.crit?84:100, out.secs.int+out.secs.exa+out.secs.lab+out.secs.dx+out.secs.plan+aj));
  return out;
}

function iniciarCaso(id, modo){
  if(PROD) return iniciarCasoProd(id, modo);
  const c=caso(id), u=sesion();
  const cv=variante(c, intentosEnCaso(id));
  if(!u){ S=nuevoTurno(cv,"invitado"); }
  else if(u.tipo==="superadmin") S=nuevoTurno(cv,"preview");
  else { const a=accesoCaso(u,c); if(!a.ok){ ir("bloqueo",{mod:modDeCaso(c)}); return; } S=nuevoTurno(cv, modo==="examen"?"examen":"practica"); }
  V={vista:"caso",p:{}}; render(); try{ window.scrollTo(0,0); }catch(e){}
}
let ULTIMO=null;
function terminarCaso(){
  if(PROD && S.c.parcialClave) return terminarSinClave();   /* producción: la clave llega de la base al guardar */
  const R=calificar(), u=sesion(), c=S.c;
  const res={R, c, modo:S.modo, min:S.min, crisis:S.crit, estable:S.tRescate!==null && !S.crit, ganados:0, gemas:0, nuevas:[], intentoId:null, resp:{}, qi:0, acciones:accionesTurno(), variante:c.variante||0};
  if((S.modo==="practica"||S.modo==="examen") && u){
    const antes=stats(u.id,c.esp), insA=insigniasDe(u.id), prev=mejores(u.id,c.esp)[c.id];
    const it={id:uid("i"), usuarioId:u.id, casoId:c.id, esp:c.esp, puntaje:R.total, crisis:S.crit, dxOk:R.dxOk, calcOk:!!R.calcOk, modo:S.modo, min:S.min, fecha:hoy(), autoeval:0, secs:R.secs};
    DB.intentos.push(it);
    let g=0, mot=[];
    if(R.total>=APRUEBA && !(prev && prev.puntaje>=APRUEBA)){ g+=GEMAS.aprobado; mot.push("aprobado"); }
    if(R.total>=85){ g+=GEMAS.excelente; mot.push("excelente"); }
    if(S.tRescate!==null && !S.crit){ g+=GEMAS.estable; mot.push("paciente estable"); }
    if(S.modo==="examen") g=Math.round(g*GEMAS.examen);
    if(g) darGemas(u.id,g,c.titulo+" ("+mot.join(", ")+")");
    guardarDB();
    const desp=stats(u.id,c.esp), insD=insigniasDe(u.id);
    Object.assign(res,{ganados:desp.puntos-antes.puntos, gemas:g, catAntes:antes.cat, catDespues:desp.cat, puntos:desp.puntos, nuevas:INSIGNIAS.filter(i=>insD.has(i.id)&&!insA.has(i.id)), intentoId:it.id});
  }
  ULTIMO=res; V={vista:"resultado",p:{}}; render(); try{ window.scrollTo(0,0); }catch(e){}
}

function aplicarPedido(){
  const u=sesion(), c=carrito().slice(); if(!c.length) return null;
  const pg={id:uid("p"), tipo:u.tipo==="admin_inst"?"entidad":"persona", items:c.map(i=>({concepto:i.concepto, valor:i.valor, tipo:i.pago})), total:c.reduce((a,i)=>a+i.valor,0), metodo:"bold", ref:"BOLD-"+Math.floor(10000+Math.random()*89999), estado:"aprobado", fecha:hoy(), recibo:++DB.config.recibo};
  if(pg.tipo==="persona") pg.usuarioId=u.id; else pg.entidadId=u.entidadId;
  if(DB.pagos.some(p=>p.ref===pg.ref)) return null; /* pago duplicado: no se aplica dos veces */
  c.forEach(i=>{
    const [t,id]=i.k.split(":");
    if(t==="mod"){ const ac=compraDe(u.id,id); const base=ac&&ac.hasta>hoy()?ac.hasta:hoy(); DB.compras.push({id:uid("c"), usuarioId:u.id, modulo:id, hasta:sumarMeses(base,12)}); }
    if(t==="cert"){ DB.certs.push({id:uid("ce"), usuarioId:u.id, modulo:id, fecha:hoy(), estado:"solicitado"}); avisar(u.id,"Su certificado de POLIANDES de "+modulo(id).nombre+" quedó solicitado. Llegará a su correo en 5 días hábiles."); avisar("superadmin","Nuevo certificado POLIANDES solicitado por "+u.nombre+" ("+modulo(id).nombre+")."); }
    const en=u.entidadId?entidad(u.entidadId):null;
    if(t==="plan"||i.k==="mes"){ if(t==="plan") en.cupos=ajustarCupos(id); const base=en.pagadoHasta&&en.pagadoHasta>=hoy()?sumarDias(en.pagadoHasta,1):hoy(); en.pagadoHasta=finDeMes(base); }
    if(t==="act"){ if(!en.modulos.includes(id)) en.modulos.push(id); }
  });
  DB.pagos.push(pg); DB.carrito[u.id]=[];
  avisar(pg.tipo==="persona"?u.id:u.entidadId, "Pago aprobado por Bold: "+pesos(pg.total)+". Recibo n.º "+pg.recibo+".");
  guardarDB(); return pg;
}

/* Termina el caso en producción: la página no tiene la clave de calificación; la base la entrega al guardar
   (o, en casos públicos sin cuenta, al pedir la revisión) y con ella se arma la misma revisión que calculó la base. */
function armarResultado(full, modoSrv){
  const n=S.c.variante||0; S.c=variante(Object.assign({}, full, {parcial:false}), n);
  const R=calificar(), c=S.c;
  return {R, c, modo:modoSrv||S.modo, min:S.min, crisis:S.crit, estable:S.tRescate!==null && !S.crit, ganados:0, gemas:0, nuevas:[], intentoId:null, resp:{}, qi:0, acciones:accionesTurno(), variante:n};
}

  $app().innerHTML=`<div class="wrap estrecho"><div class="card stack" style="max-width:520px;margin:30px auto;text-align:center"><h2>${enCola?"Resultado guardado sin señal":"No se pudo guardar el resultado"}</h2>

async function terminarSinClave(){
  const u=sesion(), c0=S.c, acciones=accionesTurno(), registra=REAL() && (S.modo==="practica"||S.modo==="examen") && u && esParticipante(u);
  $app().innerHTML=`<div class="wrap estrecho"><div class="card stack" style="text-align:center;margin:40px auto;max-width:420px"><b>${registra?"Guardando su resultado…":"Calculando su resultado…"}</b></div></div>`;
  if(!registra){
    try{ const full=await rpc("caso_clave",{p_id:c0.id}); ULTIMO=armarResultado(full); }
    catch(e){ toast(limpiarErr(e.message)); resultadoPendiente(c0,false); return; }
    V={vista:"resultado",p:{}}; render(); try{ window.scrollTo(0,0); }catch(e){} return;
  }
  const antes=stats(u.id,c0.esp), insA=insigniasDe(u.id); let r=null, enCola=false;
  for(let i=0;i<3 && !r;i++){
    try{ r = await rpc("registrar_intento", {p_caso:c0.id, p_modo:S.modo, p_acciones:acciones}); }
    catch(e){ const m=limpiarErr(e.message); if(!/conexión/.test(m)){ toast(m); break; } if(i===2){ colaAgregar({caso:c0.id, modo:S.modo, acciones}); enCola=true; } else await new Promise(ok=>setTimeout(ok,2000)); }
  }
  if(!r){ if(enCola) toast("Sin señal: su resultado quedó guardado y se enviará al volver la conexión."); resultadoPendiente(c0,enCola); return; }
  const res=armarResultado(r.caso, r.modo);
  if(res.R.total!==r.total){ res.R.total=r.total; res.R.secs=r.secs; }   /* manda el puntaje que calculó la base */
  const i=CASOS.findIndex(x=>x.id===c0.id); if(i>=0) CASOS[i]=Object.assign({}, CASOS[i], r.caso, {parcial:false, parcialClave:false});
  try{ await cargarEstado(); }catch(e){}
  const desp=stats(u.id,c0.esp), insD=insigniasDe(u.id);
  Object.assign(res,{ganados:desp.puntos-antes.puntos, gemas:r.gemas, catAntes:antes.cat, catDespues:desp.cat, puntos:desp.puntos, nuevas:INSIGNIAS.filter(x=>insD.has(x.id)&&!insA.has(x.id)), intentoId:r.id});
  ULTIMO=res; V={vista:"resultado",p:{}}; render(); try{ window.scrollTo(0,0); }catch(e){}
}

  const fa=/fibrilaci[oó]n auricular/i.test(t), flutter=/flutter|aleteo auricular/i.test(t), tv=/taquicardia ventricular/i.test(t)&&!/sin taquicardia ventricular/i.test(t),
    fv=/fibrilaci[oó]n ventricular/i.test(t), asis=/asistolia/i.test(t), bav3=/bloqueo (AV )?(completo|de tercer grado|AV completo)|tercer grado/i.test(t), bav1=/primer grado/i.test(t),
    mp=/marcapasos|espiga/i.test(t), falla=/falla de captura/i.test(t), stUp=/(elevaci[oó]n|supradesnivel)( del)? ST/i.test(t), stDn=/(depresi[oó]n|infradesnivel)( del)? ST/i.test(t),

/* ---------- 3. Auscultación sintetizada (corazón y pulmones) ---------- */
function tipoSonido(titulo, texto){
  const t0=String(titulo)+" "+String(texto||"");
  if(/abdom|peristal|intestin|ruidos hidroaéreos|hidroaereos/i.test(String(titulo))) return null;
  const t=t0.replace(/\b(sin|no se auscultan?|no hay|ausencia de|niega)\b[^.;:]*/gi," ");
  if(!/auscult|ruidos card|murmullo|estertor|sibilanc|crépit|crepit|soplo|roncus|ruidos respiratorios/i.test(t0)) return null;
  const pulmon=/pulmon|respirat|murmullo|estertor|sibilan|crepit|crépit|roncus|tórax|torax/i.test(String(titulo)) || (/murmullo|estertor|sibilan|crepit|roncus/i.test(t) && !/card|coraz/i.test(String(titulo)));
  if(pulmon){
    if(/abolid|ausencia de murmullo|silencio/i.test(t)) return "abolido";
    if(/sibilanc/i.test(t) && /estertor|crepit|crépit/i.test(t)) return "crepitos-sib";
    if(/sibilanc/i.test(t)) return "sibilancias";
    if(/estertor|crepit|crépit/i.test(t)) return "crepitos";
    if(/roncus|roncos/i.test(t)) return "roncus";
    if(/disminuid/i.test(t)) return "disminuido";
    return "vesicular";
  }
  if(/soplo diast/i.test(t)) return "soplo-d";
  if(/soplo/i.test(t) && !/sin soplos?/i.test(t)) return "soplo-s";
  if(/tercer ruido|galope|S3/i.test(t)) return "s3";
  if(/cuarto ruido|S4/i.test(t)) return "s4";
  if(/frote/i.test(t) && !/sin (soplos ni )?frote/i.test(t)) return "frote";
  if(/arrítm|arritm|irregular/i.test(t)) return "irregular";
  return "normal";
}
const NOMBRE_SONIDO={normal:"ruidos cardíacos normales", "soplo-s":"soplo sistólico", "soplo-d":"soplo diastólico", s3:"tercer ruido (galope)", s4:"cuarto ruido", frote:"frote pericárdico", irregular:"ritmo irregular",
  vesicular:"murmullo vesicular normal", crepitos:"estertores crepitantes", sibilancias:"sibilancias", "crepitos-sib":"estertores y sibilancias", roncus:"roncus", disminuido:"murmullo disminuido", abolido:"murmullo abolido"};

let AUDIO=null;
function sonar(k){

}

function qrSVG(texto, tam){

    for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(q.isDark(y,x)) r+=`M${((x+4)*c).toFixed(2)} ${((y+4)*c).toFixed(2)}h${c.toFixed(2)}v${c.toFixed(2)}h-${c.toFixed(2)}z`;
    return `<svg class="qr" viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" role="img" aria-label="Código QR de verificación"><rect width="${s}" height="${s}" fill="#fff"/><path d="${r}" fill="#000"/></svg>`;
  }catch(e){ return ""; }
}

function partirLinea(l, sep){ const out=[]; let cur="", q=false; for(let i=0;i<l.length;i++){ const ch=l[i]; if(q){ if(ch==='"'){ if(l[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; } else if(ch==='"') q=true; else if(ch===sep){ out.push(cur.trim()); cur=""; } else cur+=ch; } out.push(cur.trim()); return out; }
function leerFilas(texto){
  const lineas=String(texto||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean); if(!lineas.length) return [];
  const sep=lineas[0].includes("\t")?"\t":lineas[0].includes(";")?";":",";
  let filas=lineas.map(l=>partirLinea(l,sep));
  if(filas[0].some(x=>/correo|e-?mail|nombre/i.test(x)) && !filas[0].some(x=>correoOk(x))) filas=filas.slice(1);
  return filas.map(f=>{ const iC=f.findIndex(x=>correoOk(x)); const correo=iC>=0?f[iC].toLowerCase():""; const resto=f.filter((x,i)=>i!==iC);
    const tipo=resto.some(x=>/estudiante|interno|residente/i.test(x))?"estudiante":"profesional"; return {nombre:resto[0]||"", correo, tipo, profesion:resto.slice(1).find(x=>!/^(estudiante|profesional)$/i.test(x))||""}; });
}

function fijarRuta(o, ruta, val){ const p=ruta.split("."), k=p.pop(); const padre=p.reduce((a,x)=>a[x], o); padre[k]=val; }
function leerEditor(){ if(!EDIT) return; document.querySelectorAll("[data-ed]").forEach(el=>{ const t=el.dataset.t; fijarRuta(EDIT.c, el.dataset.ed, t==="b"?el.checked:t==="n"?(el.value===""?0:+el.value):el.value); }); }

async function guardarEditor(){
  leerEditor(); const c=EDIT.c, nota=val("ed-nota");
  const suma=c.plan.filter(p=>p.pts>0).reduce((a,p)=>a+p.pts,0); if(suma!==20){ toast("Los puntos del plan suman "+suma+"; deben sumar 20."); return; }
  if(!c.examen[0]||!c.examen[0].vitales){ toast("El primer elemento de la valoración debe ser la toma de signos vitales."); return; }
  if(REAL()){ try{ const r=await rpc("adm_caso_guardar",{p_caso:c, p_nota:nota}); const i=CASOS.findIndex(x=>x.id===c.id); if(i>=0) CASOS[i]=Object.assign({}, c, {version:r.version, revisado:hoy(), parcial:false}); EDIT=null; toast(r.resultado==="igual"?"No hubo cambios.":"Guardado: versión "+r.version+"."); ir("admin-casos",{esp:c.esp}); }catch(e){ toast(limpiarErr(e.message)); } return; }
  const i=CASOS.findIndex(x=>x.id===c.id), viejo=i>=0?CASOS[i]:null, ver=((viejo&&viejo.version)||1)+1;
  DB.casosHist=DB.casosHist||{}; (DB.casosHist[c.id]=DB.casosHist[c.id]||[]).unshift({version:ver-1, nota, guardado:hoy()});
  const nuevo=Object.assign({}, c, {version:ver, revisado:hoy()}); if(i>=0) CASOS[i]=nuevo; else { const j=(DB.casosExtra||[]).findIndex(x=>x.id===c.id); if(j>=0) DB.casosExtra[j]=nuevo; }
  [...new Set(DB.intentos.filter(x=>x.casoId===c.id).map(x=>x.usuarioId))].forEach(u=>avisar(u,"El caso «"+c.titulo+"» se actualizó (versión "+ver+")"+(nota?": "+nota:".")));
  EDIT=null; guardarDB(); toast("Guardado: versión "+ver+". En la vista previa el cambio dura hasta recargar la página."); ir("admin-casos",{esp:c.esp});
}

const COLA_KEY="eci_cola";
function colaLeer(){ try{ return JSON.parse(localStorage.getItem(COLA_KEY)||"[]"); }catch(e){ return []; } }
function colaGuardar(L){ try{ localStorage.setItem(COLA_KEY, JSON.stringify(L)); }catch(e){} }
function colaAgregar(x){ const L=colaLeer(), u=sesion(); L.push(Object.assign({t:Date.now(), uid:u?u.id:null}, x)); colaGuardar(L.slice(-30)); }
let ENVIANDO=false;
async function colaEnviar(){
  if(!REAL() || ENVIANDO) return; const u=sesion(); if(!u) return;
  const L=colaLeer(); if(!L.some(x=>x.uid===u.id)) return; ENVIANDO=true;
  try{
    const quedan=[]; let ok=0;
    for(const x of L){
      if(x.uid!==u.id){ if(Date.now()-x.t<3*864e5) quedan.push(x); continue; }   /* resultados de otra persona en este equipo: se guardan para ella */
      try{ await rpc("registrar_intento",{p_caso:x.caso, p_modo:x.modo, p_acciones:x.acciones}); ok++; }
      catch(e){ const m=limpiarErr(e.message); if(/conexión|sesión venció/i.test(m) && Date.now()-x.t<3*864e5) quedan.push(x); }
    }
    colaGuardar(quedan);
    if(ok){ try{ await cargarEstado(); }catch(e){} render(); toast(ok===1?"Se envió el resultado que estaba guardado sin señal.":"Se enviaron "+ok+" resultados guardados sin señal."); }
  } finally { ENVIANDO=false; }
}
try{ window.addEventListener("online", ()=>colaEnviar()); }catch(e){}

function habilidadesEquipoHTML(en){

function comprimir(file, max, calidad){
  return new Promise((ok,fallo)=>{ const lr=new FileReader(); lr.onerror=()=>fallo(new Error("No se pudo leer la imagen."));
    lr.onload=()=>{ const img=new Image(); img.onerror=()=>fallo(new Error("El archivo no es una imagen válida.")); img.onload=()=>{ const r=Math.min(1,max/Math.max(img.width,img.height)), cv=document.createElement("canvas"); cv.width=Math.round(img.width*r); cv.height=Math.round(img.height*r); const cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height); ok(cv.toDataURL("image/jpeg",calidad||.7)); }; img.src=lr.result; };
    lr.readAsDataURL(file); });
}

    case "adm-exportar": abrirModal(`${cabModal("Datos del caso")}<p class="small muted">Use este paquete como plantilla para casos nuevos.</p><textarea id="exp-json" readonly style="min-height:300px">${esc(JSON.stringify(caso(id),null,2))}</textarea><div><button class="btn sec" data-act="copiar-json">Copiar</button></div>`); return;
    case "copiar-json": { const t=document.getElementById("exp-json"); t.select(); try{ navigator.clipboard.writeText(t.value).then(()=>toast("Copiado."),()=>toast("Texto seleccionado: cópielo con Ctrl+C.")); }catch(e){ toast("Texto seleccionado: cópielo con Ctrl+C."); } return; }
    case "adm-fecha": { const f=val("aj-fecha"); if(f){ DB.config.fechaPrueba=f; guardarYRender("Fecha de prueba: "+fechaLarga(f)); } return; }
    case "adm-fecha-real": DB.config.fechaPrueba=null; guardarYRender("Se usa la fecha real."); return;
    case "adm-reiniciar": abrirModal(`${cabModal("Reiniciar la demostración")}<p>Se borra todo lo hecho en esta prueba.</p><div class="row"><button class="btn peligro" data-act="adm-reiniciar-si">Reiniciar</button><button class="btn sec" data-act="cerrar-modal">Cancelar</button></div>`); return;
    case "adm-reiniciar-si": reiniciarDemo(); cerrarModal(); DB.sesion="u_super"; guardarDB(); ir("admin"); toast("Demostración reiniciada."); return;
  }
});

document.addEventListener("change", ev=>{
  const t=ev.target;
  if(V.vista==="caso" && S){
    if(t.name==="dx"){ S.dx=t.value; S.dif.delete(t.value); pintarCaso(); return; }
    if(t.name==="dif"){ if(t.checked){ if(S.dif.size>=3){ t.checked=false; toast("Elija máximo 3 diferenciales."); return; } S.dif.add(t.value); } else S.dif.delete(t.value); return; }
    if(t.name==="plan"){ t.checked?S.plan.add(t.value):S.plan.delete(t.value); return; }
  }
  const k=t.dataset.cambio; if(!k) return;
  if(changeProd(t,k)) return;
  if(k==="adm-compra"){ if(!t.value) return; DB.compras.find(c=>c.id===t.dataset.id).hasta=t.value; guardarYRender("Acceso actualizado."); return; }
  if(k==="adm-ph"){ if(!t.value) return; entidad(t.dataset.id).pagadoHasta=t.value; guardarYRender("Pagado hasta actualizado: el acceso cambia de inmediato."); return; }
  if(k==="adm-activo"){ DB.casosEstado[t.dataset.id]={activo:t.checked}; guardarYRender(t.checked?"Caso activado.":"Caso desactivado."); return; }
  if(k==="adm-semana"){ DB.config.casoSemanaFijo=t.value||null; guardarYRender(t.value?"Caso de la semana fijado manualmente.":"El caso de la semana vuelve a la programación por fecha."); return; }
});
document.addEventListener("input", ev=>{ if(V.vista==="caso" && S && ev.target.id==="calc") S.calc=ev.target.value;
  if(ev.target.id==="plan-n"||ev.target.id==="re-cupos"){ const pedidas=Math.max(MIN_USU(), Math.min(MAX_USU(), Math.round(+ev.target.value||0))), n=ajustarCupos(ev.target.value), o=document.getElementById(ev.target.id+"-precio"); if(o) o.innerHTML=`${n} personas × ${pesos(tarifaPP(n))} = <b>${pesos(mensualidad(n))}</b> al mes`+(n>pedidas?` <span class="chip v">Le damos ${n} cupos: cuestan menos que ${pedidas}</span>`:""); } });

document.addEventListener("submit", ev=>{
  const f=ev.target.closest("[data-form]"); if(!f) return; ev.preventDefault();
  const tipo=f.dataset.form, u=sesion();
  if(submitExtra(tipo,f,u)) return;
  if(submitProd(tipo,f,u)) return;
  if(tipo==="ingresar"){ const c=val("in-correo").toLowerCase(), k=val("in-clave");
    if(c===SG.superadmin){ const su=usuario("u_super"); if(su && su.clave===hashClave(k)){ entrar(su); return; } return errEn("in-err","El correo o la contraseña no coinciden. Revise e intente de nuevo."); }
    if(c===SG.demo){ selectorDemo(); return; }
    const x=DB.usuarios.find(z=>z.correo.toLowerCase()===c && !z.demo);
    if(!x || x.clave!==hashClave(k)) return errEn("in-err","El correo o la contraseña no coinciden. Revise e intente de nuevo.");
    entrar(x); return; }
  if(tipo==="registro"){
    const n=val("rg-nombre"), c=val("rg-correo").toLowerCase(), k=val("rg-clave"), t=val("rg-tipo"), cod=val("rg-codigo").toUpperCase();
    if(!n) return errEn("rg-err","Escriba su nombre completo.");
    if(!correoOk(c)) return errEn("rg-err","Escriba un correo válido.");
    if(c===SG.demo||DB.usuarios.some(z=>z.correo.toLowerCase()===c)) return errEn("rg-err","Ya existe una cuenta con ese correo. Ingrese o recupere su contraseña. La prueba gratis es una sola por persona.");
    { const e=errClave(k,c); if(e) return errEn("rg-err",e); if(k!==val("rg-clave2")) return errEn("rg-err","Las dos contraseñas no coinciden."); }
    let en=null; if(cod){ en=DB.entidades.find(e=>e.codigo===cod); if(!en) return errEn("rg-err","Ese código de institución no existe. Pídalo a la coordinación."); const p=planDe(en); if(p && miembros(en.id).length>=p.hasta) return errEn("rg-err","Su institución no tiene cupos disponibles. Avise a la coordinación."); }
    if(t==="estudiante" && !correoInstitucional(c) && !en) return errEn("rg-err","El precio de estudiante requiere correo institucional (.edu.co) o el código de su institución.");
    if(!marcado("rg-datos")) return errEn("rg-err","Debe autorizar el tratamiento de datos para crear la cuenta.");
    const nu={id:uid("u"), nombre:n, tipo:t, correo:c, clave:hashClave(k), profesion:val("rg-prof"), ciudad:val("rg-ciudad"), entidadId:en?en.id:null, publico:marcado("rg-publico"), mostrar:"completo", creado:hoy(), pruebaHasta:en?null:sumarDias(hoy(),14)};
    DB.usuarios.push(nu); avisar(nu.id, en?"Bienvenido. Su institución "+en.nombre+" le habilita sus módulos.":"Bienvenido. Tiene 15 días de prueba: los 3 primeros casos de cada módulo. Cada día le enviaremos a su correo los días que le quedan.");
    entrar(nu); return; }
  if(tipo==="registro-inst"){
    const n=val("re-nombre"), resp=val("re-resp"), c=val("re-correo").toLowerCase(), k=val("re-clave"), ar="humana";
    if(!n) return errEn("re-err","Escriba el nombre de la institución.");
    if(!resp) return errEn("re-err","Escriba el nombre del administrador.");
    if(!correoOk(c)) return errEn("re-err","Escriba un correo válido.");
    if(c===SG.demo||DB.usuarios.some(z=>z.correo.toLowerCase()===c)) return errEn("re-err","Ya existe una cuenta con ese correo.");
    { const e=errClave(k,c); if(e) return errEn("re-err",e); if(k!==val("re-clave2")) return errEn("re-err","Las dos contraseñas no coinciden."); }
    if(!marcado("re-datos")) return errEn("re-err","Debe autorizar el tratamiento de datos.");
    const serv=[...document.querySelectorAll("input[name=re-serv]:checked")].map(x=>x.value);
    let es=espSugeridas(serv).filter(e=>esp(e)); if(!es.length) es=["urg","medgen","mint"];
    const en={id:uid("ent"), nombre:n, tipo:val("re-tipo"), area:ar, complejidad:val("re-comp"), ciudad:val("re-ciudad"), nit:val("re-nit"), servicios:serv, cupos:ajustarCupos(val("re-cupos")), modulos:[], prueba:es.map(e=>modId(e,1)), pagadoHasta:null, pruebaHasta:sumarDias(hoy(),14), codigo:codigoNuevo("CLI"), logo:null};
    DB.entidades.push(en);
    const nu={id:uid("u"), nombre:resp, tipo:"admin_inst", correo:c, clave:hashClave(k), profesion:"Administrador", ciudad:en.ciudad, entidadId:en.id, publico:false, mostrar:"completo", creado:hoy()};
    DB.usuarios.push(nu); avisar(en.id,"Institución registrada. Tiene 15 días de prueba con "+en.prueba.map(m=>modulo(m).nombre).join(", ")+". Invite a su equipo con el código "+en.codigo+".");
    avisar("superadmin","Nueva institución en prueba: "+n+".");
    entrar(nu); return; }
  if(tipo==="recuperar1"){ const c=val("rc-correo").toLowerCase(); if(!correoOk(c)) return errEn("rc-err","Escriba un correo válido."); ir("recuperar",{paso:2, correo:c, codigo:String(Math.floor(100000+Math.random()*900000))}); return; }
  if(tipo==="recuperar2"){ if(val("rc-cod")!==V.p.codigo) return errEn("rc-err","El código no coincide. Revise el correo que le enviamos."); { const e=errClave(val("rc-nueva"),V.p.correo); if(e) return errEn("rc-err",e); if(val("rc-nueva")!==val("rc-nueva2")) return errEn("rc-err","Las dos contraseñas no coinciden."); }
    const x=DB.usuarios.find(z=>z.correo.toLowerCase()===V.p.correo && !z.demo); if(x){ x.clave=hashClave(val("rc-nueva")); guardarDB(); }
    ir("ingresar"); toast("Si el correo tiene una cuenta, la contraseña ya fue cambiada."); return; }
  if(tipo==="perfil"){ u.nombre=val("pf-nombre")||u.nombre; u.profesion=val("pf-prof"); u.ciudad=val("pf-ciudad"); u.mostrar=val("pf-mostrar"); u.publico=marcado("pf-publico"); if(document.getElementById("pf-serv")){ u.servicio=val("pf-serv"); u.correos=marcado("pf-correos"); } guardarYRender("Perfil guardado."); return; }
  if(tipo==="unirse"){ const cod=val("un-cod").toUpperCase(), en=DB.entidades.find(e=>e.codigo===cod); if(!en) return errEn("un-err","Ese código no existe. Pídalo a la coordinación de su institución."); const p=planDe(en); if(p&&miembros(en.id).length>=p.hasta) return errEn("un-err","Su institución no tiene cupos disponibles."); u.entidadId=en.id; guardarYRender("Ahora pertenece a "+en.nombre+"."); return; }
  if(tipo==="clave"){ if(u.clave!==hashClave(val("ck-actual"))) return errEn("ck-err","La contraseña actual no coincide."); { const e=errClave(val("ck-nueva"),u.correo); if(e) return errEn("ck-err",e); if(val("ck-nueva")!==val("ck-nueva2")) return errEn("ck-err","Las dos contraseñas no coinciden."); } u.clave=hashClave(val("ck-nueva")); guardarYRender("Contraseña cambiada."); return; }
  if(tipo==="agregar-miembro"){ const en=entidad(u.entidadId), n=val("am-nombre"), c=val("am-correo").toLowerCase(), p=planDe(en);
    if(!n) return errEn("am-err","Escriba el nombre."); if(!correoOk(c)) return errEn("am-err","Escriba un correo válido.");
    if(DB.usuarios.some(z=>z.correo.toLowerCase()===c)) return errEn("am-err","Ya existe una cuenta con ese correo: pídale que se una con el código de invitación.");
    if(p && miembros(en.id).length>=p.hasta) return errEn("am-err","Su plan está lleno ("+p.hasta+" personas). Cambie a un plan más grande en el Market.");
    const temp="ECI"+Math.floor(10000+Math.random()*89999);
    DB.usuarios.push({id:uid("u"), nombre:n, tipo:val("am-tipo"), correo:c, clave:hashClave(temp), profesion:val("am-prof"), ciudad:en.ciudad, entidadId:en.id, publico:true, mostrar:"completo", creado:hoy(), pruebaHasta:null});
    guardarDB(); render(); abrirModal(`${cabModal("Persona agregada")}<p><b>${esc(n)}</b> ya pertenece a su equipo.</p><div class="info small">En la versión publicada recibe un correo de bienvenida desde ${APP.buzon}. Contraseña temporal de esta demostración: <b>${temp}</b></div><div><button class="btn verde" data-act="cerrar-modal">Listo</button></div>`); return; }
  if(tipo==="perfil-inst"){ const en=entidad(u.entidadId); en.nombre=val("pe-nombre")||en.nombre; en.nit=val("pe-nit"); en.complejidad=val("pe-comp"); en.ciudad=val("pe-ciudad"); en.servicios=[...document.querySelectorAll("input[name=pe-serv]:checked")].map(x=>x.value);
    const fl=document.getElementById("pe-logo").files[0]; if(fl) comprimir(fl,160,.85).then(img=>{ en.logo=img; guardarYRender("Perfil guardado."); }).catch(e=>toast(e.message)); else guardarYRender("Perfil guardado."); return; }
  if(tipo==="asignar"){ const t=val("as-tit"), fch=val("as-fecha"), cs=[...document.querySelectorAll("input[name=as-caso]:checked")].map(x=>x.value);
    if(!t) return errEn("as-err","Escriba un título."); if(!cs.length) return errEn("as-err","Elija al menos un caso."); if(!fch||fch<hoy()) return errEn("as-err","Elija una fecha límite desde hoy en adelante.");
    DB.asignaciones.push({id:uid("as"), entidadId:u.entidadId, titulo:t, casos:cs, limite:fch, creada:hoy()});
    miembros(u.entidadId).forEach(m=>avisar(m.id,"Nueva asignación de su institución: «"+t+"» ("+cs.length+" casos) hasta el "+fechaLarga(fch)+"."));
    guardarYRender("Asignación creada y avisada a su equipo."); return; }
  if(tipo==="importar"){
    let c; try{ c=JSON.parse(val("imp-json")); }catch(e){ return errEn("imp-err","El texto no tiene un formato válido. Copie el paquete completo, desde la primera llave { hasta la última }."); }
    const falta=["id","esp","nivel","titulo","presentacion","paciente","preguntas","examen","laboratorios","rescate","diagnosticos","dxPts","dxEsperado","plan","fisio","perlas","autoeval"].filter(x=>c[x]===undefined);
    if(falta.length) return errEn("imp-err","Al paquete le faltan estos datos: "+falta.join(", ")+".");
    if(!esp(c.esp)) return errEn("imp-err","La especialidad «"+c.esp+"» no existe.");
    if(caso(c.id)) return errEn("imp-err","Ya existe un caso con el identificador «"+c.id+"». Cámbielo.");
    if(!c.examen[0]||!c.examen[0].vitales) return errEn("imp-err","El primer elemento de la valoración debe ser la toma de signos vitales.");
    const suma=c.plan.filter(p=>p.pts>0).reduce((a,p)=>a+p.pts,0); if(suma!==20) return errEn("imp-err","Los puntos del plan suman "+suma+"; deben sumar 20.");
    c.lote=c.lote||DB.config.proximoLote; c.entorno=c.entorno||"Urgencias"; c.tiempoMeta=c.tiempoMeta||60; c.duracion=c.duracion||"15–25 min"; c.servicio=c.servicio||esp(c.esp).n; delete c.gratis;
    if(REAL()){ importarReal(c); return; }
    DB.casosExtra.push(c); DB.casosEstado[c.id]={activo:false}; guardarYRender("Caso cargado como inactivo. Revíselo con «Vista previa» y actívelo."); return; }
  if(tipo==="precios"){ const P=DB.config.precios, n=id=>Math.max(0,parseInt(val(id))||0);
    P.modulo=n("pr-mod"); P.descEstudiante=Math.min(90,n("pr-desc")); P.certPoliandes=n("pr-cert"); P.activacion=n("pr-act");
    P.tramos.forEach((t,i)=>{ t.pp=n("pr-p"+i); t.hasta=Math.max(1,n("pr-h"+i)); }); P.minUsuarios=Math.max(1,n("pr-min")); DB.config.proximoLote=val("pr-lote")||DB.config.proximoLote;
    guardarYRender("Precios guardados."); return; }
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && document.getElementById("capa").innerHTML) cerrarModal(); });

addEventListener("hashchange",()=>{ if(!PROD && location.hash==="#sg" && !sesion()) ir("ingresar",{reservado:true}); });
if(PROD){ arrancarProd(); addEventListener("hashchange",()=>{ if(location.hash==="#sg" && MODO!=="real"){ if(MODO==="demo") salirDemo(); ir("ingresar",{reservado:true}); } }); }
else { cargarDB();
if(DB.sesion && !usuario(DB.sesion)) DB.sesion=null;
{ const u=sesion(); V={vista:casa(u), p:{}};
  try{ const vq=new URLSearchParams(location.search).get("verificar"); if(vq) V={vista:"verificar", p:{codigo:vq}}; }catch(e){}
  /* acceso oculto del Superadministrador: dirección terminada en #sg */
  try{ if(location.hash==="#sg" && !u) V={vista:"ingresar", p:{reservado:true}}; }catch(e){} const m=u?registrarEntrada(u):null; guardarDB(); render(); if(m) toast(m); } }
/* solo en la vista previa: acceso para las pruebas automáticas */
if(!PROD){ try{ window.__eci={ get S(){ return S; }, get DB(){ return DB; }, caso, usuario, entidad }; }catch(e){} }
})();
</script></body></html>
